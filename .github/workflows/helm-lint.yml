---
name: Helm Lint and Test

on:
  push:
  pull_request:

jobs:
  helm-lint:
    name: Helm Lint and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Run helm lint
        run: |
          helm lint interlink/
          
      - name: Validate rendered templates with kubeval
        run: |
          # Install kubeval
          curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          sudo mv kubeval /usr/local/bin/
          
          # Render templates and validate
          helm template virtual-node ./interlink --values ./interlink/values.yaml | kubeval --ignore-missing-schemas

      - name: Render the SSH shadow settings
        run: |
          # The default values never render shadowMode "ssh"; check its settings here.
          example=./interlink/examples/ssh_tunnel.yaml
          secret_writes() { awk '/- secrets$/{s=1} s&&/- apiGroups:/{exit} s' | grep -qE -- '- (create|update|patch)$'; }

          on=$(helm template virtual-node ./interlink --values "$example" \
            --set virtualNode.network.ssh.forwardTarget=node \
            --set virtualNode.network.ssh.nodeHostKeys=verify \
            --set virtualNode.network.ssh.reverse.enabled=true \
            --set virtualNode.network.ssh.reverse.sshd=userspace \
            --set virtualNode.network.ssh.reverse.allowSocks=true)
          for want in 'ReplicateCredentials: true' 'ForwardTarget: "node"' 'NodeHostKeys: "verify"' \
            'Sshd: "userspace"' 'AllowSocks: true'; do
            grep -qF "$want" <<<"$on" || { echo "not rendered: $want"; exit 1; }
          done
          secret_writes <<<"$on" || { echo "no Secret write access with replicateCredentials on"; exit 1; }

          # The reverse tunnel and its SOCKS proxy are opt-in: the default allowSocks
          # and a quoted "false" for either must leave them off.
          rev=$(helm template virtual-node ./interlink --values "$example" \
            --set virtualNode.network.ssh.reverse.enabled=true)
          grep -qF 'Reverse:' <<<"$rev" || { echo "reverse.enabled=true not rendered"; exit 1; }
          if grep -qF 'AllowSocks' <<<"$rev"; then
            echo "AllowSocks rendered with the default allowSocks"; exit 1
          fi
          rev=$(helm template virtual-node ./interlink --values "$example" \
            --set virtualNode.network.ssh.reverse.enabled=true \
            --set-string virtualNode.network.ssh.reverse.allowSocks=false)
          grep -qF 'Reverse:' <<<"$rev" || { echo "reverse.enabled=true not rendered"; exit 1; }
          if grep -qF 'AllowSocks' <<<"$rev"; then
            echo "AllowSocks rendered with allowSocks \"false\""; exit 1
          fi
          rev=$(helm template virtual-node ./interlink --values "$example" \
            --set-string virtualNode.network.ssh.reverse.enabled=false)
          if grep -qF 'Reverse:' <<<"$rev"; then
            echo "Reverse rendered with reverse.enabled \"false\""; exit 1
          fi

          off=$(helm template virtual-node ./interlink --values "$example" \
            --set virtualNode.network.ssh.replicateCredentials=false)
          grep -qF 'ReplicateCredentials: false' <<<"$off" || { echo "replicateCredentials=false not rendered"; exit 1; }
          if secret_writes <<<"$off"; then
            echo "Secret write access granted with replicateCredentials=false"; exit 1
          fi

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: |
          ct lint --chart-dirs . --charts interlink --validate-maintainers=false

      - name: Test chart installation
        run: |
          # Create kind cluster for testing
          kind create cluster --wait 300s
          
          # Test chart installation
          helm install test-release ./interlink --dry-run --debug