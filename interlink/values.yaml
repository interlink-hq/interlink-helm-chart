# Default values for interlink.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nodeName: virtual-node

interlink:
  image: ghcr.io/interlink-hq/interlink/interlink:latest
  enabled: false
  exportPodData: false
  skipDownwardAPIResolution: false
  dataRootVolume: ""
  # unix socket in /var/run
  socket: ""
  # if socket is specified, the address/port are ignored
  address: http://localhost
  port: 4000
  kubernetesApiAddr: ""
  kubernetesApiPort: ""
  kubernetesApiCaCrt: ""
  # If true, do nothing about projected volumes (flag useful in test environment)
  disableProjectedVolumes: false
  # TLS configuration for secure communication
  tls:
    enabled: false
    certFile: ""
    keyFile: ""
    caCertFile: ""
  # Logging configuration
  logging:
    verboseLogging: false
    errorsOnlyLogging: false
  # Tracing configuration
  tracing:
    enabled: false
  # Plugin endpoint configuration for VPN/networking
  pluginEndpoint:
    url: ""
    port: ""
  # Resource requests and limits for the interlink container
  resources:
    CPU:
      request: "100m"
      limit: "500m"
    memory:
      request: "128Mi"
      limit: "512Mi"
  # Extra volume mounts for the interlink container
  extraVolumeMounts: []
    # - name: data-root
    #   mountPath: /data
    #   readOnly: false
  # # Enable job script translation from outside service
  # jobScript:
  #   JobScriptBuildConfig:
  #     singularity_hub: {}
  #     apptainer_options: {}
  #     volume_options: {}

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:latest
  resources:
    CPUs: 8
    memGiB: 49
    pods: 100
    # add accelerators to the virtual node
    # accelerators:
    # fpga example
    # - resourceType: xilinx.com/fpga
    #  model: u55c
    #  available: 1
    # gpu example
    # - resourceType: nvidia.com/gpu
    #  model: a100
    #  available: 1
  HTTPProxies:
    HTTP: null
    HTTPs: null
  HTTP:
    insecure: true
    CACert: ""
  kubeletHTTP:
    insecure: true
  # Tracing configuration
  tracing:
    enabled: false
  # uncomment to enable custom nodeSelector and nodeTaints
  # nodeLabels:
  #  - "accelerator=a100"
  # nodeTaints:
  #  - key: "accelerator"
  #    value: "a100"
  #    effect: "NoSchedule"
  # Resource requests and limits for the virtual kubelet container
  containerResources:
    CPU:
      request: "100m"
      limit: "500m"
    memory:
      request: "128Mi"
      limit: "512Mi"
  # Extra volume mounts for the virtual kubelet container
  extraVolumeMounts: []
    # - name: data-root
    #   mountPath: /data
    #   readOnly: false

  # # Indicate endpoint for JobScript translator
  # JobScriptBuilderURL: "https://test.translator.com/podtranslate"

  disableCSR: false

  # Network tunnel configuration for wstunnel
  network:
    # Enable tunnel feature (creates wstunnel template ConfigMap)
    enableTunnel: false
    # Container image for wstunnel
    tunnelImage: "ghcr.io/erebe/wstunnel:latest"
    # DNS domain for ingress (e.g., "example.com")
    wildcardDNS: ""
    # Enable TLS for ingress (requires wildcardDNS)
    ingressTLS: false
    # ClusterIssuer for TLS certificate (optional, requires ingressTLS)
    ingressClusterIssuer: ""
    # Path where wstunnel template will be mounted in VK container
    wstunnelTemplatePath: "/etc/templates/wstunnel.yaml"
    # Template type: "nginx" (default) or "traefik"
    templateType: ""
    # Custom wstunnel template content (optional, overrides templateType if set)
    customTemplate: ""
    wstunnelCommand: |
      curl -L https://github.com/erebe/wstunnel/releases/download/v10.4.4/wstunnel_10.4.4_linux_amd64.tar.gz -o wstunnel.tar.gz && tar -xzvf wstunnel.tar.gz && chmod +x wstunnel && ./wstunnel client --http-upgrade-path-prefix %s %s ws://%s:80 &
    # WireGuard full mesh network options
    fullMesh: false
    serviceCIDR: ""
    podCIDRCluster: ""
    dnsServiceIP: ""
    wireguardGoURL: ""
    wgToolURL: ""
    slirp4netnsURL: ""
    unshareMode: ""
    meshScriptTemplatePath: ""
    # Backward-compatible alias for dnsServiceIP
    dnsService: ""
    # Which shadow pod is rendered for offloaded pods with exposed ports:
    # "wstunnel" (default) or "ssh". With "ssh" the shadow dials in to an HPC login
    # node and forwards each port from the compute node the job landed on, so no
    # compute node needs outbound internet access and no public ingress is required.
    # It replaces wstunnel, not fullMesh, and cannot be combined with it.
    shadowMode: ""
    # SSH port-forward shadow settings, used when shadowMode is "ssh"
    ssh:
      # Login node to forward through, and the login name on it (both required)
      loginHost: ""
      user: ""
      port: 22
      # Image running in the shadow. It needs an ssh client, plus kinit when auth is
      # "kerberos". Defaults to interLink's ssh-tunnel image for this VK version.
      image: ""
      # "publickey" (default) or "kerberos"
      auth: ""
      # Where the ssh session ends, and so who connects to each exposed port.
      # "login" (default): the login node connects to <node>:<port>, so the workload
      # must listen on the compute node's network address. "node": the session goes
      # through the login node to the compute node's own sshd, which connects to
      # 127.0.0.1:<port>, or to a unix socket for the ports listed in the pod's
      # interlink.eu/shadow-socket-ports annotation (needs SocketDirRoot in the
      # plugin). The workload then never listens on the network, and the compute
      # node's host key is checked as nodeHostKeys says.
      forwardTarget: ""
      # What the login node is asked to do: "portforward" (default) uses its sshd
      # forwarding (ssh -L to the node's address, or ssh -W to the node's sshd with
      # forwardTarget "node") and needs AllowTcpForwarding there; "exec" runs
      # execConnectCommand instead and needs no forwarding privilege on the login
      # node. With forwardTarget "node" the forwards are always ssh -L on the
      # compute node's sshd.
      forwardMode: ""
      # Command run on the login node in "exec" mode: <command> <node> <port>, or
      # <command> <node> 22 with forwardTarget "node". reverse.nodeExec "srun" with
      # reverse.sshd "node" also runs <command> 127.0.0.1 22 on the compute node, in
      # either forwardMode. Defaults to "nc"; use "ncat" or "nc -q 1" on a netcat
      # that does not propagate a half-close.
      execConnectCommand: ""
      # publickey: Secret holding the private key, and the key inside it. This is the
      # shadow's own key: a dedicated, restricted key (see the SSH tunnel guide),
      # never the plugin's, as it ends up in every shadow's namespace.
      keySecret: ""
      keySecretKey: ""
      # kerberos: Secret holding the keytab, the key inside it, and the principal
      keytabSecret: ""
      keytabSecretKey: ""
      principal: ""
      # Optional ConfigMap holding a krb5.conf, mounted at /etc/krb5.conf
      krb5ConfigMap: ""
      # Optional ConfigMap holding a known_hosts file: the login node's key, plus,
      # for sessions on compute nodes, their keys, a host pattern such as
      # "node*.example.org ssh-ed25519 AAAA..." or an "@cert-authority" line. Without
      # it the shadow falls back to StrictHostKeyChecking=accept-new, which trusts
      # whatever key the login node presents on first contact.
      knownHostsConfigMap: ""
      # How compute node host keys are checked, for every session on a compute node:
      # "verify" (default) accepts only keys from knownHostsConfigMap or from the
      # login node's /etc/ssh/ssh_known_hosts files, which are trusted only as far
      # as the login node is, so pin it in knownHostsConfigMap. "accept-new" trusts
      # whatever key a node presents first, with a warning.
      nodeHostKeys: ""
      # Copy the credential into the shadow's namespace, so offloaded pods in
      # per-user namespaces work without seeding it everywhere by hand. This grants
      # the virtual kubelet create/update on Secrets cluster-wide, and makes the
      # credential readable by anyone who can read Secrets in those namespaces.
      replicateCredentials: true
      # How long the shadow waits for the plugin to report the compute node before
      # failing. Queue waits are normal, so this is generous (default 2h).
      nodeWaitTimeout: ""
      # Extra ssh client options, each passed as -o <option> on every hop (login
      # node and compute node). They come after the fixed options and ssh keeps the
      # first value it sees, so the fixed options win; the exception is
      # GSSAPIDelegateCredentials on the login hop, which they can turn back on.
      extraOptions: []
      # Let offloaded pods open connections back into the cluster through the same
      # login node, asked for per pod with interlink.eu/reverse-forwards. Each
      # forward becomes a unix socket in the pod's socket directory on the compute
      # node (needs SocketDirRoot in the plugin), and a relay the job starts serves
      # it on a loopback address to the job's own user only.
      reverse:
        enabled: false
        # Which sshd makes the forwards: "node" (default), the compute node's own
        # sshd; "userspace", an sshd the shadow starts in the job, for sites whose
        # node sshd refuses forwarding. "userspace" runs a script the shadow sends,
        # so it does not work with a command-restricted key.
        sshd: ""
        # How the shadow reaches the compute node: "ssh" (default) port 22 through
        # the login node, as forwardMode says; "srun" (srun --jobid --overlap in the
        # job's allocation, running execConnectCommand 127.0.0.1 22, or the
        # user-space sshd itself) is a last resort with lower throughput, and with
        # auth "kerberos" it delegates the ticket to the login node.
        nodeExec: ""
        # sshd on the compute node, for "userspace" only (default /usr/sbin/sshd)
        sshdPath: ""
        # python3 on the compute node, which runs the relay (default python3)
        pythonPath: ""
        # Let pods ask for a SOCKS proxy with interlink.eu/reverse-socks-port. It
        # listens on 127.0.0.1 of the compute node, open to every user of that node,
        # and reaches any endpoint the shadow reaches in the cluster: leave false
        # where the site forbids proxies. While false, such pods are refused.
        allowSocks: false

plugin:
  enabled: false
  image: ""
  command: []
  args: []
  # content of the "config" will be mounted as /etc/interlink/plugin.yaml
  config: ""
  envs: []
    # - name: SLURMCONFIGPATH
    #   value: /etc/interlink/plugin.yaml
  socket: null
  # if socket is specified, the address/port are ignored
  address: ""
  port: 3000
  # Run plugin container with privileged permissions
  privileged: false
  # Resource requests and limits for the plugin container
  resources:
    CPU:
      request: "500m"
      limit: "2"
    memory:
      request: "500Mi"
      limit: "2Gi"
  # Extra volume mounts for the plugin container
  extraVolumeMounts: []
    # - name: data-root
    #   mountPath: /data
    #   readOnly: false

sshBastion:
  enabled: false
  image: lscr.io/linuxserver/openssh-server:latest
  clientKeys:
    authorizedKeys: ""
    keysURL: ""
  hostKeys:
    priv: ""
    pub: ""
  port: 31022
  # Resource requests and limits for the SSH bastion container
  resources:
    CPU:
      request: "50m"
      limit: "100m"
    memory:
      request: "64Mi"
      limit: "128Mi"
  # Extra volume mounts for the SSH bastion container
  extraVolumeMounts: []
    # - name: data-root
    #   mountPath: /data
    #   readOnly: false
# disable OAUTH when using sockets for communication in the in-cluster mode
OAUTH:
  enabled: false
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw-refresh:latest
  TokenURL: DUMMY
  ClientID: DUMMY
  ClientSecret: DUMMY
  RefreshToken: DUMMY
  GrantType: authorization_code
  Audience: DUMMY
  # Resource requests and limits for the OAuth refresh token container
  resources:
    CPU:
      request: "100m"
      limit: "200m"
    memory:
      request: "300Mi"
      limit: "500Mi"
  # Extra volume mounts for the OAuth refresh token container
  extraVolumeMounts: []
    # - name: data-root
    #   mountPath: /data
    #   readOnly: false

# define extra volumes (e.g. for DataRootVolume)
extraVolumes: []
  # - name: data-root
  #   hostPath:
  #     path: /scratch/interlink/
  #     type: DirectoryOrCreate

# Extra containers added to the virtual node pod, next to the plugin. For
# example, in-cluster mode via ssh needs a sidecar that mounts the HPC job
# directory into the pod (sshfs), and with Kerberos one that renews the ticket.
# Names must not repeat those of the chart's containers (vk, plugin, interlink,
# ...); rendering fails if they do. To replace plugin or interlink, disable it
# and add your own container under that name.
extraContainers: []
  # - name: sshfs
  #   image: registry.example.org/sshfs-sidecar:latest
  #   securityContext:
  #     privileged: true
  #   volumeMounts:
  #     - name: data-root
  #       mountPath: /scratch/interlink/jobs
  #       mountPropagation: Bidirectional

# Init containers for the virtual node pod, e.g. to install helper binaries
# into a volume the plugin mounts.
extraInitContainers: []
  # - name: install-tools
  #   image: registry.example.org/tools:latest
  #   command: ["cp", "/tools/bin/helper", "/opt/tools/"]
  #   volumeMounts:
  #     - name: tools
  #       mountPath: /opt/tools

# Pod scheduling configuration
podScheduling:
  # Node selector for the interlink pod
  nodeSelector: {}
    # kubernetes.io/hostname: specific-node
    # node-type: worker

  # Tolerations for the interlink pod
  tolerations: []
    # - key: "node-type"
    #   operator: "Equal"
    #   value: "gpu"
    #   effect: "NoSchedule"
    # - key: "dedicated"
    #   operator: "Exists"
    #   effect: "NoSchedule"
